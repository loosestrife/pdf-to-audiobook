[project]
name = "pdf-to-audiobook"
version = "0.1.0"
description = "Convert PDF books into high-quality audiobooks using Kokoro TTS"
readme = "README.md"
requires-python = ">=3.10.0"
dependencies = [
    "pymupdf>=1.25.0",
    "soundfile>=0.13.0",
    "numpy>=1.26.0",
    "regex>=2024.0.0",
    "num2words>=0.5.14",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    "kokoro>=0.9.0",
    "torch>=2.6.0",
]

[project.scripts]
pdf-to-audiobook = "cli:main"
